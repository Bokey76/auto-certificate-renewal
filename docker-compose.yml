# 在这台机器上对着 Dockerfile 构建时保留 build 和下面的本地 tag。
# 本机构建并推到阿里云容器镜像服务时：image 改成仓库全名，删掉 build。步骤见 docs/使用.md。
services:
  renew:
    image: auto-certificate-renewal:local
    build: .
    command: ["cert-renew", "schedule"]
    pid: host
    privileged: true
    env_file:
      - .env
    volumes:
      - ./config/config.yaml:/config/config.yaml:ro
      - acme-data:/var/lib/acme
      - /www/server/panel/vhost/cert:/www/server/panel/vhost/cert
      - /var/www/acme:/var/www/acme
    restart: unless-stopped

  # 状态页。不挂证书目录，也不使用 privileged / pid: host。
  web:
    image: auto-certificate-renewal:local
    build: .
    command: ["cert-renew", "web"]
    env_file:
      - .env
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./config/config.yaml:/config/config.yaml:ro
      - acme-data:/var/lib/acme
    restart: unless-stopped

volumes:
  acme-data:
